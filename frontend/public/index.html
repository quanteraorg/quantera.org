<script>

 ['^GSPC','S&P 500','Index','Index',5600,0,0,1,'US'],['^N225','Nikkei 225','Index','Index',38200,0,0,1,'JP'],['^STOXX','STOXX Europe 600','Index','Index',515,0,0,.9,'EU'],
 ['BTC-USD','Bitcoin','Crypto','Crypto',64000,1200,0,2.4,'—'],['ETH-USD','Ethereum','Crypto','Crypto',2600,310,0,2.8,'—'],
 ['GC=F','Gold futures','Commodity','Metals',2650,0,0,.1,'—'],['CL=F','WTI crude oil','Commodity','Energy',72,0,0,1.1,'—'],['EURUSD','EUR/USD','Currency','FX',1.09,0,0,.3,'—'],['^TNX','US 10-Year Treasury yield','Bond','Rates',4.1,0,0,.4,'US']],

};
const Data={
 P:MockProvider,
 all(){return this.P.universe.map(u=>({sym:u[0],name:u[1],type:u[2],sector:u[3],px:u[4],cap:u[5],pe:u[6],beta:u[7],ctry:u[8],g:u.length>9?u[9]:Math.round((hash(u[0])%38)+(u[7]>1.5?8:0)),de:u.length>10?u[10]:+((hash(u[0]+'d')%20)/10).toFixed(1)}))},

 search(q){q=q.toLowerCase().trim();if(!q)return{};const sc=a=>{const t=(a.sym+' '+a.name+' '+a.sector).toLowerCase();if(t.includes(q))return 2+(a.sym.toLowerCase()==q?3:0)+(a.sym.toLowerCase().startsWith(q)?1:0);let i=0;for(const c of t)if(c==q[i])i++;return i==q.length&&q.length>2?1:0};

  for(const k in this.P.concepts)if(k.includes(q)||q.includes(k)){out['Related assets']=this.P.concepts[k].filter(s=>this.get(s)).map(s=>({t:s+'  '+this.get(s).name,h:'#/asset/'+encodeURIComponent(s)}));out['Education']=[{t:'Lesson: how '+k+' moves markets',h:'#/learn'}];out['News']=[{t:'News and events tagged “'+k+'”',h:'#/news'}];out['Research']=[{t:'Market reaction study: '+k,h:'#/asset/NVDA'}]}

/* ===== home with 3D network ===== */
PAGES.home=()=>{$('#m').innerHTML=`<div class="hero"><canvas id="cv"></canvas><div id="tip"></div><div class="t"><h1>QUANTERA</h1><p>Understand the world’s financial system.<br>Markets. Research. Intelligence. Education. One system.</p><div><a class="btn p" href="#/markets">Explore Markets</a><a class="btn" href="#/terminal">Enter Terminal</a></div></div></div>
<section style="padding:80px 0 0"><h2 style="font-size:clamp(26px,4vw,44px);max-width:760px;font-weight:500">Other sites tell you what happened. Quantera shows why, how the market reacted, and what else moved.</h2>
<div class="g g3" style="margin-top:36px">${[['What happened','Quotes, charts, filings and news for any security the data provider carries.'],['Why and how it reacted','Market Reaction Intelligence compares speed, magnitude and recovery across assets for the same event.'],['How confident we are','Every output states its source, sample size and method, split into data, analysis and interpretation.']].map(x=>`<div class="pan"><h3>${x[0]}</h3><span class="mu">${x[1]}</span></div>`).join('')}</div>
<p class="mu" style="margin-top:28px">Prototype build. All prices, fundamentals and statistics are mock data from a replaceable provider layer. No live market access is claimed.</p></section>`;
 const cv=$('#cv'),x=cv.getContext('2d'),tip=$('#tip'),dpr=devicePixelRatio||1,mob=innerWidth<800,N=mob?450:1400,named=Data.all(),r=rng(5);
 const nodes=Array.from({length:N},(_,i)=>{const u=r()*2-1,t=r()*6.283,k=Math.sqrt(1-u*u)*(.55+r()*.45);return{x:k*Math.cos(t),y:u*.8,z:k*Math.sin(t),a:i<named.length?named[i]:null,c:i%7}});

  if(hv>=0){const a=nodes[hv].a;tip.style.display='block';tip.style.left=e.clientX-b.left+14+'px';tip.style.top=e.clientY-b.top+'px';tip.innerHTML=`<b>${a.sym}</b> ${a.name}<br><span class="mu">${a.type} · ${a.sector}</span>`}else tip.style.display='none'};

 const col=['#8fb4e8','#5fb89a','#c9b27a','#8b93a3','#a9b8d6','#7aa6a0','#b79a8e'];

const GL=`Stock|A small slice of ownership in a company.
Share|One unit of a company's stock.
ETF|A fund you can buy like a stock that holds many investments.
Mutual fund|A pooled fund run by a manager, priced once a day.
Bond|A loan you give to a government or company that pays interest.
Yield|The income an investment pays each year, as a percent of its price.
Dividend|Cash a company pays to its shareholders.
Market cap|Total value of a company: share price times number of shares.
P/E ratio|Share price divided by yearly earnings per share.
EPS|Earnings per share: profit divided by number of shares.
Revenue|All the money a company brings in from sales.
Net income|Profit left after all costs, interest and taxes.
Margin|Profit as a percent of revenue.
Volatility|How much a price moves up and down.
Beta|How much a stock tends to move compared with the overall market.
Diversification|Spreading money across many investments to reduce risk.
Bull market|A period when prices are rising.
Bear market|A period when prices have fallen a lot, often 20% or more.
Inflation|The rate prices rise, which lowers what money can buy.
Interest rate|The cost of borrowing money, or the reward for saving.
Liquidity|How easily you can buy or sell without moving the price.
Volume|How many shares traded in a period.
Limit order|An order to buy or sell only at your chosen price or better.
Market order|An order to buy or sell right now at the current price.
Leverage|Using borrowed money to make bigger bets.
Drawdown|The drop from a peak to a low point.
Sharpe ratio|Return earned for each unit of risk taken.
Compound interest|Earning returns on your earlier returns.
IPO|A company's first sale of shares to the public.
Short selling|Betting a price will fall by selling borrowed shares.
Option|A contract giving the right to buy or sell at a set price.
DCF|Valuing a company by adding up its expected future cash, in today's money.`.split('\n').map(l=>l.split('|'));

const LX={
compound:{i:'Compound interest means you earn returns not only on the money you put in, but also on the returns you already earned. Your gains start earning their own gains, so growth speeds up the longer you wait.',

 e:'$10,000 at 7% a year: after 10 years it is about $19,700; after 20 years about $38,700; after 30 years about $76,100. The last 10 years add more than the first 20 combined, because the base is so much bigger.',

 k:['Gains earn gains, so growth accelerates over time.','Time is the most powerful input.','Small, regular contributions add up to large sums.'],

 q:[['Two portfolios have the same average return; one is more volatile. The volatile one has…',['A wider range of outcomes','A guaranteed higher result','The same range'],0,'Volatility spreads results out in both directions.'],['A Monte Carlo result says "80% of paths reach your goal". This means…',['In 20% of simulated futures you fall short','You will certainly reach it','The return is 80%'],0,'It is a probability across simulated paths, not a promise.']]},
dcf:{i:'A discounted cash flow (DCF) model values a business as the sum of all the cash it will produce in the future, translated into today\'s money.',
 h:['Step 1: forecast free cash flow for several years.','Step 2: estimate a <b>terminal value</b> for all the years after that (often most of the total).','Step 3: <b>discount</b> each future amount back to today: value today = cash ÷ (1 + discount rate)<sup>years</sup>.','The discount rate reflects risk and the return investors require.'],
 e:'A company makes $100M of free cash flow growing 5% a year. With a 9% discount rate and 2.5% long-term growth, the value is roughly $1.6B. Change the discount rate to 10% and it drops to about $1.4B — a 1-point change moves the value ~13%.',
 m:['Treating the output as precise — it is only as good as the assumptions.','Using a long-term growth rate above the economy\'s growth (it would eventually be bigger than the world).','Forgetting that the terminal value usually dominates the answer.'],
 k:['Value = future cash in today\'s money.','Higher discount rate → lower value.','Test a range of assumptions, not one number.'],
 q:[['Why is $100 in five years worth less than $100 today?',['You could invest today\'s $100 and earn a return meanwhile','Money expires','Banks charge fees'],0,'That lost opportunity (plus risk) is exactly what discounting captures.'],['Most of a typical DCF value comes from…',['The terminal value','The first year\'s cash flow','The share count'],0,'Years beyond the forecast window usually account for well over half of the total.']]},
options:{i:'An option is a contract giving the right, but not the obligation, to buy (call) or sell (put) a stock at a set price before a set date. Its value depends on the stock price, time left and how much the stock tends to move (volatility).',
 h:['A call is worth more when the stock price is higher relative to the strike price.','More <b>time</b> left means more chances for a big move, so more value.','Higher <b>volatility</b> means a bigger chance of a large move — and since your loss is capped at the price paid, more value.','As expiry approaches, time value melts away ("time decay").'],
 e:'A stock trades at $100. A 3-month $100 call might cost about $4 when volatility is 20%, but about $8 when volatility is 40% — the same option, twice the price, purely because bigger moves are expected.',
 m:['Buying options right before earnings without realising the price already includes the expected jump.','Forgetting time decay — an option can lose value even if the stock does not move.'],
 k:['Value depends on price, time and volatility.','Volatility raises option prices.','Time decay works against option buyers.'],
 q:[['The stock does not move for a month. What happens to a call option you own?',['It usually loses value from time decay','It gains value','It is unchanged'],0,'Less time remains for a favourable move, so time value shrinks.'],['Why do option prices jump before earnings?',['A big move is expected, raising implied volatility','Companies set them','Interest rates change'],0,'Expected volatility is priced in, which makes options more expensive.']]},
ycurve:{i:'The yield curve plots interest rates on government bonds from short to long maturities. Its shape tells you what markets expect for growth, inflation and central-bank policy.',
 h:['<b>Normal (upward):</b> long rates above short rates — investors want extra pay for locking money up longer.','<b>Flat:</b> uncertainty about the future.','<b>Inverted:</b> short rates above long rates — markets expect rates to be cut, often because a slowdown is coming.','Short rates follow the central bank; long rates follow expectations for growth and inflation.'],
 e:'In 2022–2023 the US 2-year yield rose above the 10-year yield, the deepest inversion in decades, as the Fed hiked aggressively while markets expected cuts later.',
 m:['Treating an inversion as a timing signal — recessions, when they come, have arrived anywhere from months to two years later.','Ignoring that the curve reflects many things at once (inflation, policy, demand for safe bonds).'],
 k:['The curve shows rates across maturities.','Inversion = short rates above long rates.','It has often (not always) come before recessions.'],
 q:[['The 2-year yield is 5% and the 10-year is 4%. The curve is…',['Inverted','Normal','Flat'],0,'Short rates above long rates is the definition of an inverted curve.'],['Which rates are most directly set by the central bank\'s policy?',['Short-term rates','30-year rates','Mortgage fees'],0,'Short yields track the policy rate closely; long yields reflect expectations.']]},
stock:{i:'A stock (or share) is a small piece of ownership in a company. If the company grows and earns more, your piece usually becomes worth more; some companies also pay part of their profit to owners as dividends.',
 h:['Companies sell shares to raise money; after that, investors trade them with each other on an exchange.','The price moves with supply and demand, which reflect what investors think future profits will be.','You make money two ways: the price rising (capital gain) and dividends.','Your maximum loss is what you paid; the possible gain has no ceiling.'],
 e:'If a company has 1 billion shares and you own 100, you own one ten-millionth of it. If the company\'s value rises from $50B to $60B, each share goes from $50 to $60 and your 100 shares from $5,000 to $6,000.',
 m:['Thinking a low share price means "cheap" — a $5 stock can be more expensive than a $500 one relative to its profits.','Confusing the company with the stock: a great company can be a poor investment if the price already assumes perfection.'],
 k:['A share is part-ownership of a business.','Prices reflect expectations of future profits.','Returns come from price gains and dividends.'],
 q:[['You own 1,000 shares of a company with 1,000,000 shares. You own…',['0.1% of the company','1%','10%'],0,'1,000 ÷ 1,000,000 = 0.001, or 0.1%.'],['What is the most you can lose buying a stock (no borrowing)?',['What you paid','Unlimited','Double what you paid'],0,'The price can only fall to zero.']]},
rule72:{i:'The Rule of 72 is a quick mental trick: divide 72 by an annual growth rate to estimate how many years it takes for money to double.',
 h:['<b>Years to double ≈ 72 ÷ rate (%)</b>.','It works for anything that compounds: investments, inflation, debt.','It is most accurate for rates between about 4% and 12%.'],
 e:'At 8% a year, money doubles in about 72 ÷ 8 = 9 years. At 3% inflation, prices double in about 24 years — so $100 of groceries today costs about $200 in 24 years.',
 m:['Using it for very high rates (at 50% it is noticeably off).','Forgetting it also works against you: credit-card debt at 24% doubles in about 3 years.'],
 k:['72 ÷ rate = years to double.','Use it for investments, inflation and debt.','A few extra percent shortens doubling time a lot.'],
 q:[['Roughly how long does money take to double at 6%?',['12 years','6 years','20 years'],0,'72 ÷ 6 = 12.'],['A loan at 18% a year left unpaid doubles in about…',['4 years','18 years','10 years'],0,'72 ÷ 18 = 4 — compounding works against borrowers too.']]},
dividend:{i:'A dividend is cash a company pays its shareholders out of profits. The dividend yield tells you how much income you get each year for every dollar invested.',
 h:['<b>Dividend yield = annual dividend per share ÷ share price</b>.','If the price falls and the dividend stays, the yield rises — and vice versa.','A very high yield can be a warning: the market may expect the dividend to be cut.','Reinvesting dividends makes compounding much stronger.'],
 e:'A stock at $50 pays $2 a year: yield 4%. If the price drops to $40, the same $2 is a 5% yield. Over the last century, reinvested dividends have made up a large share of total US stock returns.',
 m:['Chasing the highest yield without asking whether the company can keep paying it.','Ignoring taxes on dividends in taxable accounts.'],
 k:['Yield = dividend ÷ price.','High yields can signal risk.','Reinvested dividends power long-term returns.'],
 q:[['A $100 stock pays $3 a year. Its dividend yield is…',['3%','30%','0.3%'],0,'$3 ÷ $100 = 3%.'],['A stock\'s yield suddenly jumps to 12% because its price fell. This most likely means…',['Investors fear the dividend will be cut','The company is very safe','Dividends doubled'],0,'Falling prices push the yield up, often because the market doubts the payout.']]},
loan:{i:'Loan payments repay interest and part of the original amount (principal) each month. How much you pay overall depends on the rate and how long the loan lasts.',
 h:['Early payments are mostly interest; later payments are mostly principal (this schedule is called amortisation).','A longer term lowers the monthly payment but raises total interest.','A small rate difference changes total cost a lot on big, long loans.'],
 e:'A $300,000 mortgage over 30 years: at 4% the payment is about $1,432/month and total interest about $216,000; at 7% it is about $1,996/month and total interest about $419,000.',
 m:['Focusing only on the monthly payment and not the total cost.','Not paying extra principal when possible — even small extra payments cut years off a loan.'],
 k:['Payments cover interest first, then principal.','Longer term = smaller payment, more interest overall.','Rate matters enormously on long loans.'],
 q:[['Stretching a car loan from 3 to 6 years usually…',['Lowers the monthly payment but increases total interest','Lowers both','Raises both'],0,'You pay interest for twice as long.'],['Early in a mortgage, most of each payment goes to…',['Interest','Principal','Fees'],0,'Interest is charged on the large remaining balance.']]},
pe:{i:'The price-to-earnings (P/E) ratio shows how many dollars investors pay for each dollar of a company\'s yearly profit. It is the most common quick measure of how "expensive" a stock is.',
 h:['<b>P/E = share price ÷ earnings per share</b> (or market value ÷ total profit).','A high P/E means investors expect fast growth; a low P/E can mean low expectations — or a bargain.','Compare P/Es within the same industry and against the company\'s own history.'],
 e:'A stock at $60 earning $3 per share has a P/E of 20. A fast-growing software company might trade at 40, a mature bank at 10. Neither is automatically right or wrong.',
 m:['Comparing P/Es across very different industries.','Ignoring that earnings can be temporarily high or low (e.g., in a recession).','Forgetting companies with losses have no meaningful P/E.'],
 k:['P/E = price per dollar of profit.','High P/E = high growth expectations.','Compare like with like.'],
 q:[['A $90 stock earns $4.50 per share. Its P/E is…',['20','4.5','90'],0,'90 ÷ 4.5 = 20.'],['Why might a company deserve a higher P/E than another?',['Its profits are expected to grow faster','Its share price is higher','It has more employees'],0,'Investors pay more today for faster expected profit growth.']]},
fees:{i:'Fees look tiny — 0.5% or 1% a year — but they are charged every year on your whole balance, so they compound against you and can take a huge share of your final wealth.',
 h:['The expense ratio of a fund is taken from your balance every year whether the fund gains or not.','Over decades, a 1% fee can consume around a quarter of your ending balance.','Low-cost index funds often charge 0.03%–0.10%.'],
 e:'$100,000 for 30 years at 7%: with a 0.05% fee it grows to about $750,000; with a 1% fee about $574,000. That 1% cost you roughly $176,000.',
 m:['Judging a fee by its size in one year instead of over decades.','Assuming higher fees buy better performance — most high-fee active funds trail cheap index funds over time.'],
 k:['Fees compound against you.','1% a year is a big deal over 30 years.','Prefer low-cost funds unless there is a clear reason.'],
 q:[['Over 30 years, which costs you more?',['A 1% yearly fee','A one-time $100 fee on a $100,000 account','They cost the same'],0,'1% of a growing balance every year adds up to far more.'],['A fund charges 0.04%. On $10,000 that is about…',['$4 a year','$40 a year','$400 a year'],0,'0.04% × $10,000 = $4.']]},
drawdown:{i:'A drawdown is a fall from a previous peak. Losses and gains are not symmetrical: after a loss you need a larger percentage gain just to get back to where you were.',
 h:['<b>Gain needed to recover = loss ÷ (1 − loss)</b>.','−10% needs +11%; −25% needs +33%; −50% needs +100%; −80% needs +400%.','This is why avoiding big losses matters so much for long-term results.'],
 e:'The Nasdaq fell about 78% from 2000 to 2002. It needed a gain of about 350% to recover and did not regain its 2000 peak until 2015.',
 m:['Thinking a 50% loss followed by a 50% gain gets you back to even (it leaves you 25% down).','Taking concentrated bets where one large loss could take years to recover.'],
 k:['Bigger losses need much bigger gains to recover.','−50% needs +100%.','Limiting large losses is central to long-term investing.'],
 q:[['You lose 50%, then gain 50%. Overall you are…',['Down 25%','Back to even','Up 25%'],0,'$100 → $50 → $75.'],['After a 20% loss, what gain gets you back to even?',['25%','20%','15%'],0,'0.20 ÷ 0.80 = 25%.']]},
inflation:{i:'Inflation is the general rise in prices over time. It means each dollar buys less, so money kept in cash slowly loses purchasing power.',
 h:['Real return = investment return − inflation (roughly).','At 3% inflation, prices double in about 24 years (Rule of 72).','Central banks usually target about 2% inflation and raise rates when it runs higher.'],
 e:'$10,000 in cash for 20 years at 3% inflation buys what about $5,500 buys today. A savings account paying 2% during 4% inflation loses about 2% of purchasing power a year.',
 m:['Thinking cash is "safe" over long periods — it is safe from price swings, not from inflation.','Ignoring inflation when planning goals decades away.'],
 k:['Inflation shrinks what money can buy.','Look at real (after-inflation) returns.','Long-term savings need to outgrow inflation.'],
 q:[['Your savings earn 2% while inflation is 5%. Your real return is about…',['−3%','+7%','+2%'],0,'2% − 5% = −3% in purchasing power.'],['Which loses purchasing power most reliably over 30 years?',['Cash under the mattress','A diversified stock fund','Inflation-linked bonds'],0,'Cash earns nothing while prices rise every year.']]},
income:{i:'An income statement shows how much a company sold, what it spent, and what was left as profit over a period (a quarter or a year).',
 h:['<b>Revenue</b> (sales) at the top.','Minus cost of goods sold = <b>gross profit</b>.','Minus operating expenses (salaries, marketing, R&D) = <b>operating income</b>.','Minus interest and taxes = <b>net income</b> (the "bottom line"). Divided by shares = earnings per share.','Margins (profit ÷ revenue) show how much of each sales dollar is kept.'],
 e:'Revenue $1,000M, cost of goods $600M → gross profit $400M (40% margin). Operating costs $250M → operating income $150M (15%). Interest and tax $50M → net income $100M (10% net margin).',
 m:['Looking only at revenue growth while margins shrink.','Ignoring one-off items that make a single quarter look unusually good or bad.'],
 k:['Revenue → gross profit → operating income → net income.','Margins show efficiency.','Read trends over several periods.'],
 q:[['Revenue $500M, net income $50M. The net margin is…',['10%','50%','5%'],0,'50 ÷ 500 = 10%.'],['Which line comes right after revenue minus cost of goods sold?',['Gross profit','Net income','Dividends'],0,'Revenue − cost of goods sold = gross profit.']]},
orders:{i:'When you buy or sell a stock you choose an order type. The two basics: a market order (fill now at the best available price) and a limit order (fill only at your price or better).',
 h:['<b>Market order:</b> executes almost instantly, but the exact price is not guaranteed — in fast or thin markets it can be worse than the last quote.','<b>Limit order:</b> you set the maximum you will pay (or minimum you will accept). You control the price but may not get filled.','<b>Stop order:</b> becomes a market order once a trigger price is hit, often used to limit losses.','The <b>spread</b> is the gap between the best bid (buy) and ask (sell) prices.'],
 e:'A stock shows bid $49.98 / ask $50.02. A market buy fills around $50.02. A limit buy at $49.90 waits until a seller accepts $49.90 — which may never happen.',
 m:['Using market orders on illiquid stocks or at the market open, when spreads are wide.','Setting limits far from the price and forgetting about them.'],
 k:['Market = speed, limit = price control.','Watch the bid–ask spread.','Use limits on thinly traded stocks.'],
 q:[['You must buy at no more than $20. Which order?',['A limit buy at $20','A market buy','A stop sell'],0,'A limit order sets your maximum price.'],['A market order guarantees…',['That it fills quickly','The exact price','No fees'],0,'Speed of execution is guaranteed, not the price.']]},
leverage:{i:'Leverage means investing with borrowed money. It magnifies both gains and losses relative to your own money.',
 h:['With 2× leverage, a 10% move in the investment becomes about a 20% move in your equity.','Borrowing costs interest, which eats into returns.','If losses shrink your equity too far, the broker issues a <b>margin call</b> and may sell your holdings at the worst time.'],
 e:'You put in $10,000 and borrow $10,000 to buy $20,000 of stock. A 20% rise makes $4,000 (+40% on your money). A 20% fall loses $4,000 (−40%). A 50% fall wipes you out completely.',
 m:['Focusing on magnified gains and ignoring magnified losses.','Holding leveraged ETFs long-term without understanding daily resets, which erode value in choppy markets.'],
 k:['Leverage multiplies gains and losses.','Borrowing has a cost.','Margin calls can force selling at the bottom.'],
 q:[['With 3× leverage, the asset falls 10%. Your equity falls about…',['30%','10%','3%'],0,'Losses are multiplied by the leverage.'],['What is a margin call?',['A demand to add money because losses shrank your equity','A dividend payment','A type of order'],0,'The broker requires more collateral or sells your positions.']]},
sizing:{i:'Position sizing decides how much money to put into each trade or investment so that no single loss can do serious damage.',
 h:['A common rule: risk only 1–2% of your account on any one trade.','<b>Shares = (account × risk %) ÷ (entry price − stop price)</b>.','Wider stops mean smaller positions; tighter stops allow larger ones, for the same risk.'],
 e:'Account $20,000, risk 1% = $200. Buy at $50 with a stop at $46 (risk $4 per share): 200 ÷ 4 = 50 shares, a $2,500 position. If the stop is hit you lose about $200.',
 m:['Choosing size by gut feeling or by how confident you feel.','Moving stops further away after entering to "give it room", which quietly increases risk.'],
 k:['Decide the risk first, then the size.','1–2% risk per trade keeps losses survivable.','Size depends on the distance to your stop.'],
 q:[['$10,000 account, 2% risk, entry $40, stop $38. How many shares?',['100','50','200'],0,'Risk $200 ÷ $2 per share = 100 shares.'],['Your stop moves further from entry but risk stays 1%. Your position size should…',['Shrink','Grow','Stay the same'],0,'More risk per share means fewer shares for the same dollar risk.']]},
ratios:{i:'Financial ratios turn a company\'s numbers into quick comparisons: how profitable it is, how much debt it carries, and how easily it can pay its bills.',
 h:['<b>Profitability:</b> net margin (profit ÷ revenue), return on equity (profit ÷ shareholders\' equity).','<b>Debt:</b> debt-to-equity — how much borrowing compared with owners\' money.','<b>Liquidity:</b> current ratio (current assets ÷ current liabilities); above 1 means short-term assets cover short-term bills.','<b>Valuation:</b> P/E, price-to-sales, price-to-book.'],
 e:'Company A: net margin 25%, debt-to-equity 0.3, current ratio 2. Company B: net margin 3%, debt-to-equity 2.5, current ratio 0.8. A is more profitable, less indebted and more liquid.',
 m:['Comparing ratios across industries with very different norms (banks always carry high leverage).','Looking at one ratio in isolation.'],
 k:['Ratios compare companies quickly.','Group them: profitability, debt, liquidity, valuation.','Compare within an industry and over time.'],
 q:[['A current ratio of 0.6 suggests…',['Short-term bills exceed short-term assets','Very high profits','No debt'],0,'Current assets cover only 60% of current liabilities.'],['Return on equity measures…',['Profit relative to shareholders\' money','Share price growth','Dividend size'],0,'ROE = net income ÷ shareholders\' equity.']]},
cashflow:{i:'Cash flow tracks real money moving in and out of a business. Profit can be shaped by accounting choices; cash is much harder to fake.',
 h:['<b>Operating cash flow:</b> cash generated by the core business.','<b>Capital expenditure (capex):</b> money spent on equipment, buildings, technology.','<b>Free cash flow = operating cash flow − capex</b>: cash left for dividends, buybacks, debt repayment or growth.'],
 e:'A company reports $500M profit but only $150M of operating cash flow because customers have not paid yet. After $100M of capex, free cash flow is $50M — far weaker than profit suggests.',
 m:['Trusting earnings while cash flow keeps lagging (a classic warning sign).','Ignoring capex for capital-heavy businesses like airlines or chipmakers.'],
 k:['Cash flow shows real money.','Free cash flow = operating cash − capex.','Profits that never turn into cash are a red flag.'],
 q:[['Operating cash flow $800M, capex $300M. Free cash flow is…',['$500M','$1,100M','$300M'],0,'800 − 300 = 500.'],['Profits keep rising but operating cash flow keeps falling. This is…',['A warning sign worth investigating','Always good news','Irrelevant'],0,'Earnings not turning into cash can mean aggressive accounting or customers not paying.']]},
peg:{i:'The PEG ratio adjusts the P/E ratio for growth, so you can compare a fast grower and a slow grower more fairly.',
 h:['<b>PEG = P/E ÷ expected annual earnings growth (%)</b>.','Around 1 is often called fairly priced; below 1 may be cheap for its growth; above 2 may be expensive.','It depends heavily on the growth forecast, which can be wrong.'],
 e:'Stock A: P/E 30, growth 30% → PEG 1.0. Stock B: P/E 15, growth 5% → PEG 3.0. Despite the higher P/E, A looks cheaper relative to its growth.',
 m:['Trusting optimistic growth forecasts.','Using PEG for companies with negative or very unstable earnings.'],
 k:['PEG = P/E ÷ growth.','It compares value across growth rates.','Only as good as the growth estimate.'],
 q:[['P/E 24, expected growth 12%. The PEG is…',['2','12','0.5'],0,'24 ÷ 12 = 2.'],['Which looks cheaper relative to growth?',['PEG 0.8','PEG 2.5','They are equal'],0,'A lower PEG means paying less for each unit of growth.']]},
capm:{i:'Beta measures how much a stock tends to move with the overall market. The Capital Asset Pricing Model (CAPM) uses beta to estimate the return investors should expect for taking that risk.',
 h:['Beta 1 = moves with the market; 1.5 = about 50% bigger moves; 0.5 = about half.','<b>Expected return = risk-free rate + beta × (market return − risk-free rate)</b>.','The extra return over the risk-free rate is compensation for market risk.'],
 e:'Risk-free rate 4%, market expected to return 9% (a 5% premium). A stock with beta 1.4: 4% + 1.4 × 5% = 11% expected return.',
 m:['Treating beta as total risk — it ignores company-specific risk.','Assuming beta is stable; it changes as businesses change.'],
 k:['Beta = sensitivity to the market.','Higher beta → higher required return.','CAPM is a simple model, not a forecast.'],
 q:[['A stock with beta 2 when the market rises 5% would typically move about…',['+10%','+5%','+2%'],0,'Beta 2 roughly doubles the market move.'],['Risk-free 3%, market premium 6%, beta 1. CAPM expected return?',['9%','6%','3%'],0,'3% + 1 × 6% = 9%.']]},
rsi:{i:'The Relative Strength Index (RSI) is a momentum indicator from 0 to 100 that compares recent gains with recent losses, usually over 14 periods.',
 h:['Above 70 is often called "overbought" (rose fast); below 30 "oversold" (fell fast).','In strong trends RSI can stay above 70 or below 30 for a long time.','Divergence — price making a new high while RSI makes a lower high — can hint momentum is fading.'],
 e:'A stock rises 9 days out of 10 and RSI climbs to 78. That does not mean it must fall; in a strong uptrend RSI often sits between 60 and 80 for weeks.',
 m:['Selling just because RSI is above 70 in a strong uptrend.','Using RSI alone without considering trend or news.'],
 k:['RSI measures momentum on a 0–100 scale.','70/30 are guides, not rules.','Look for divergences and the overall trend.'],
 q:[['RSI falls to 25. This usually means…',['The price fell quickly recently','The company is bankrupt','Volume is high'],0,'Low RSI reflects strong recent selling.'],['In a powerful uptrend, RSI above 70…',['Can persist for a long time','Always signals an immediate drop','Is impossible'],0,'Overbought can stay overbought.']]},
options101:{i:'Options are contracts on a stock. A call profits if the price rises above the strike; a put profits if it falls below. Buyers pay a premium; their loss is limited to that premium.',
 h:['<b>Call:</b> the right to buy at the strike price before expiry.','<b>Put:</b> the right to sell at the strike price before expiry.','Each US stock option usually covers 100 shares.','At expiry, a call is worth (stock − strike) if positive; a put (strike − stock) if positive.'],
 e:'Stock at $100. You buy a $105 call for $2 (×100 = $200). At expiry the stock is $112: the call is worth $7 → $700, profit $500. If the stock is $104, the call expires worthless and you lose $200.',
 m:['Forgetting the premium when calculating break-even (strike + premium for a call).','Selling options without understanding the possibly large losses.'],
 k:['Calls bet on rises, puts on falls (or protect against them).','Buyers risk only the premium.','Break-even = strike ± premium.'],
 q:[['You buy a $50 call for $3. The break-even at expiry is…',['$53','$50','$47'],0,'Strike + premium paid.'],['Which option gains when a stock falls?',['A put','A call','Neither'],0,'A put gives the right to sell at the higher strike.']]},
bs:{i:'The Black-Scholes model prices options from five inputs. The "Greeks" measure how an option\'s price reacts to each input.',
 h:['Inputs: stock price, strike, time to expiry, volatility, interest rate.','<b>Delta:</b> price change per $1 move in the stock (0 to 1 for calls).','<b>Gamma:</b> how fast delta changes.','<b>Theta:</b> value lost per day from time decay.','<b>Vega:</b> change per 1-point change in volatility.'],
 e:'A call with delta 0.6 rises about $0.60 when the stock rises $1. With theta −0.05, it loses about $5 per contract per day if nothing else changes.',
 m:['Assuming the Greeks stay constant — they change as price and time change.','Treating model value as "true value"; real volatility is unknown.'],
 k:['Five inputs drive option prices.','Delta, gamma, theta and vega describe sensitivities.','Models are approximations.'],
 q:[['A call has delta 0.4. The stock rises $2. The option rises about…',['$0.80','$2','$0.40'],0,'0.4 × $2 = $0.80.'],['Which Greek measures time decay?',['Theta','Vega','Delta'],0,'Theta is the daily loss in value from time passing.']]},
sharpe:{i:'The Sharpe ratio measures return per unit of risk. It answers: was the extra return worth the extra volatility?',
 h:['<b>Sharpe = (portfolio return − risk-free rate) ÷ volatility</b>.','The Sortino ratio is similar but only counts downside volatility, since upside swings are welcome.','Higher is better; above 1 is generally considered good over long periods.'],
 e:'Fund A: 12% return, 20% volatility. Fund B: 9% return, 8% volatility. Risk-free 4%. Sharpe A = 0.40; Sharpe B = 0.63. B delivered more return for the risk taken.',
 m:['Comparing Sharpe ratios measured over different periods.','Trusting a high Sharpe from a short or calm period.'],
 k:['Sharpe = excess return ÷ volatility.','Sortino focuses on downside risk.','Use it to compare risk-adjusted performance.'],
 q:[['Return 10%, risk-free 2%, volatility 16%. The Sharpe ratio is…',['0.5','0.625','8'],0,'(10 − 2) ÷ 16 = 0.5.'],['Sortino differs from Sharpe because it…',['Counts only downside volatility','Ignores returns','Uses dividends'],0,'Upside swings are not penalised.']]},
kelly:{i:'The Kelly criterion calculates the bet size that maximises long-term growth when you know your odds. In practice most people use a fraction of it because estimates are uncertain.',
 h:['For a simple bet: <b>Kelly % = W − (1 − W) ÷ R</b>, where W is win probability and R is win/loss ratio.','Betting more than Kelly increases risk and actually lowers long-run growth.','"Half Kelly" keeps most of the growth with much smaller swings.'],
 e:'You win 55% of the time and wins equal losses (R = 1): Kelly = 0.55 − 0.45 = 10% of your bankroll per bet. Half Kelly would be 5%.',
 m:['Plugging in overconfident win rates — errors push you to oversize.','Using full Kelly and enduring huge drawdowns.'],
 k:['Kelly sizes bets to maximise growth.','Over-betting destroys growth.','Use a fraction because your edge is uncertain.'],
