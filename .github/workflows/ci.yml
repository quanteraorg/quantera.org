name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run the backend test suite (fake providers, no keys)
        working-directory: backend
        run: sh test.sh

  frontend:
    name: Frontend smoke test (errors, overflow, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build TypeScript modules (type check + Vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Install test tools
        working-directory: frontend/tests
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        working-directory: frontend/tests
        run: npm run syntax
      - name: Install Chromium
        working-directory: frontend/tests
        run: npx playwright install --with-deps chromium
      - name: Serve the site and run the smoke test
        run: |
          (cd frontend/public && python3 -m http.server 8124 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://localhost:8124/ >/dev/null && break; sleep 0.5; done
          cd frontend/tests && npm run smoke
